services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repaircrm_client}
      POSTGRES_USER: ${POSTGRES_USER:-repaircrm_client}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repaircrm_client}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repaircrm_client} -d ${POSTGRES_DB:-repaircrm_client}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-55440}:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-56379}:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      CLIENT_PORTAL_ENVIRONMENT: ${CLIENT_PORTAL_ENVIRONMENT:-development}
      CLIENT_PORTAL_DATABASE_URL: ${CLIENT_PORTAL_DATABASE_URL:-postgresql+psycopg://repaircrm_client:repaircrm_client@postgres:5432/repaircrm_client}
      CLIENT_PORTAL_SECRET_KEY: ${CLIENT_PORTAL_SECRET_KEY:-dev-secret-change-me}
      CLIENT_PORTAL_SYNC_API_KEY: ${CLIENT_PORTAL_SYNC_API_KEY:-dev-sync-token}
      CLIENT_PORTAL_TENANT_KEY: ${CLIENT_PORTAL_TENANT_KEY:-default}
      CLIENT_PORTAL_TOKEN_TTL_MINUTES: ${CLIENT_PORTAL_TOKEN_TTL_MINUTES:-43200}
      CLIENT_PORTAL_REFRESH_TOKEN_TTL_DAYS: ${CLIENT_PORTAL_REFRESH_TOKEN_TTL_DAYS:-60}
      CLIENT_PORTAL_AUTH_POLICY: ${CLIENT_PORTAL_AUTH_POLICY:-phone_or_email}
      CLIENT_PORTAL_REQUIRE_VERIFIED_CONTACT_FOR_ORDERS: ${CLIENT_PORTAL_REQUIRE_VERIFIED_CONTACT_FOR_ORDERS:-true}
      CLIENT_PORTAL_BRAND_NAME: ${CLIENT_PORTAL_BRAND_NAME:-Repair CRM}
      CLIENT_PORTAL_ACCENT_COLOR: ${CLIENT_PORTAL_ACCENT_COLOR:-#0f766e}
      CLIENT_PORTAL_LOGO_URL: ${CLIENT_PORTAL_LOGO_URL:-}
      CLIENT_PORTAL_SUPPORT_PHONE: ${CLIENT_PORTAL_SUPPORT_PHONE:-}
      CLIENT_PORTAL_SUPPORT_EMAIL: ${CLIENT_PORTAL_SUPPORT_EMAIL:-}
      CLIENT_PORTAL_DELIVERY_DEBUG: ${CLIENT_PORTAL_DELIVERY_DEBUG:-true}
      CLIENT_PORTAL_CORS_ORIGINS: ${CLIENT_PORTAL_CORS_ORIGINS:-*}
      CLIENT_PORTAL_RATE_LIMIT_ENABLED: ${CLIENT_PORTAL_RATE_LIMIT_ENABLED:-true}
      CLIENT_PORTAL_RATE_LIMIT_WINDOW_SECONDS: ${CLIENT_PORTAL_RATE_LIMIT_WINDOW_SECONDS:-60}
      CLIENT_PORTAL_RATE_LIMIT_DEFAULT_LIMIT: ${CLIENT_PORTAL_RATE_LIMIT_DEFAULT_LIMIT:-120}
      CLIENT_PORTAL_RATE_LIMIT_AUTH_LIMIT: ${CLIENT_PORTAL_RATE_LIMIT_AUTH_LIMIT:-20}
      CLIENT_PORTAL_REDIS_URL: ${CLIENT_PORTAL_REDIS_URL:-redis://redis:6379/0}
      CLIENT_PORTAL_CRM_BASE_URL: ${CLIENT_PORTAL_CRM_BASE_URL:-}
      CLIENT_PORTAL_CRM_API_KEY: ${CLIENT_PORTAL_CRM_API_KEY:-}
      CLIENT_PORTAL_CRM_TENANT_KEY: ${CLIENT_PORTAL_CRM_TENANT_KEY:-}
      CLIENT_PORTAL_MOBILE_PUSH_ENABLED: ${CLIENT_PORTAL_MOBILE_PUSH_ENABLED:-false}
      CLIENT_PORTAL_MOBILE_PUSH_PROVIDER: ${CLIENT_PORTAL_MOBILE_PUSH_PROVIDER:-stub}
      CLIENT_PORTAL_MOBILE_PUSH_API_KEY: ${CLIENT_PORTAL_MOBILE_PUSH_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8040}:8040"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      CLIENT_PORTAL_ENVIRONMENT: ${CLIENT_PORTAL_ENVIRONMENT:-development}
      CLIENT_PORTAL_DATABASE_URL: ${CLIENT_PORTAL_DATABASE_URL:-postgresql+psycopg://repaircrm_client:repaircrm_client@postgres:5432/repaircrm_client}
      CLIENT_PORTAL_SECRET_KEY: ${CLIENT_PORTAL_SECRET_KEY:-dev-secret-change-me}
      CLIENT_PORTAL_SYNC_API_KEY: ${CLIENT_PORTAL_SYNC_API_KEY:-dev-sync-token}
      CLIENT_PORTAL_TENANT_KEY: ${CLIENT_PORTAL_TENANT_KEY:-default}
      CLIENT_PORTAL_TOKEN_TTL_MINUTES: ${CLIENT_PORTAL_TOKEN_TTL_MINUTES:-43200}
      CLIENT_PORTAL_REFRESH_TOKEN_TTL_DAYS: ${CLIENT_PORTAL_REFRESH_TOKEN_TTL_DAYS:-60}
      CLIENT_PORTAL_AUTH_POLICY: ${CLIENT_PORTAL_AUTH_POLICY:-phone_or_email}
      CLIENT_PORTAL_REQUIRE_VERIFIED_CONTACT_FOR_ORDERS: ${CLIENT_PORTAL_REQUIRE_VERIFIED_CONTACT_FOR_ORDERS:-true}
      CLIENT_PORTAL_BRAND_NAME: ${CLIENT_PORTAL_BRAND_NAME:-Repair CRM}
      CLIENT_PORTAL_ACCENT_COLOR: ${CLIENT_PORTAL_ACCENT_COLOR:-#0f766e}
      CLIENT_PORTAL_LOGO_URL: ${CLIENT_PORTAL_LOGO_URL:-}
      CLIENT_PORTAL_DELIVERY_DEBUG: ${CLIENT_PORTAL_DELIVERY_DEBUG:-true}
      CLIENT_PORTAL_CORS_ORIGINS: ${CLIENT_PORTAL_CORS_ORIGINS:-*}
      CLIENT_PORTAL_CRM_BASE_URL: ${CLIENT_PORTAL_CRM_BASE_URL:-}
      CLIENT_PORTAL_CRM_API_KEY: ${CLIENT_PORTAL_CRM_API_KEY:-}
      CLIENT_PORTAL_CRM_TENANT_KEY: ${CLIENT_PORTAL_CRM_TENANT_KEY:-}
      CLIENT_PORTAL_SYNC_WORKER_INTERVAL_SECONDS: ${CLIENT_PORTAL_SYNC_WORKER_INTERVAL_SECONDS:-60}
      CLIENT_PORTAL_SYNC_WORKER_BATCH_SIZE: ${CLIENT_PORTAL_SYNC_WORKER_BATCH_SIZE:-100}
      CLIENT_PORTAL_MOBILE_PUSH_ENABLED: ${CLIENT_PORTAL_MOBILE_PUSH_ENABLED:-false}
      CLIENT_PORTAL_MOBILE_PUSH_PROVIDER: ${CLIENT_PORTAL_MOBILE_PUSH_PROVIDER:-stub}
      CLIENT_PORTAL_MOBILE_PUSH_API_KEY: ${CLIENT_PORTAL_MOBILE_PUSH_API_KEY:-}
      RUN_MIGRATIONS: "false"
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4300}:80"

volumes:
  postgres-data:
