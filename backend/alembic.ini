[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Default URL is a placeholder; in practice DATABASE_URL is injected via
# env var CLIENT_PORTAL_DATABASE_URL (Postgres in production / Docker dev,
# overridden to a temp SQLite in CI if no Postgres is available).
sqlalchemy.url = postgresql+psycopg://repaircrm_client:repaircrm_client@127.0.0.1:55440/repaircrm_client

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
