<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="hi-frame" x1="86" y1="64" x2="420" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="hi-glass" x1="120" y1="40" x2="380" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="hi-screen" x1="200" y1="120" x2="340" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hi-accent" x1="280" y1="80" x2="420" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="hi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Orbits -->
  <ellipse cx="280" cy="220" rx="248" ry="196" stroke="url(#hi-frame)" stroke-width="1.2" opacity="0.9"/>
  <ellipse cx="280" cy="220" rx="210" ry="168" stroke="rgba(148,163,184,0.25)" stroke-width="1" stroke-dasharray="6 14"/>
  <!-- Phone body -->
  <rect x="188" y="72" width="184" height="296" rx="28" fill="#0b1220" stroke="rgba(148,163,184,0.35)" stroke-width="1.5"/>
  <rect x="198" y="88" width="164" height="264" rx="18" fill="url(#hi-screen)"/>
  <!-- Screen UI lines -->
  <rect x="216" y="108" width="128" height="10" rx="5" fill="rgba(148,163,184,0.35)"/>
  <rect x="216" y="132" width="96" height="8" rx="4" fill="rgba(148,163,184,0.22)"/>
  <rect x="216" y="148" width="72" height="8" rx="4" fill="rgba(148,163,184,0.14)"/>
  <rect x="216" y="188" width="128" height="56" rx="10" fill="rgba(20,184,166,0.12)" stroke="rgba(45,212,191,0.4)" stroke-width="1"/>
  <path d="M228 214h40v4h-40zm0 12h88v4h-88z" fill="rgba(94,234,212,0.5)"/>
  <circle cx="312" cy="216" r="14" fill="url(#hi-accent)" filter="url(#hi-glow)" opacity="0.95"/>
  <path d="M306 216l4 4 10-10" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Floating badge -->
  <g transform="translate(380 100)">
    <rect width="120" height="76" rx="14" fill="url(#hi-glass)" stroke="rgba(255,255,255,0.2)"/>
    <path d="M24 38h72M24 50h48" stroke="rgba(248,250,252,0.45)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="28" r="8" fill="url(#hi-accent)"/>
  </g>
  <!-- Tool accent -->
  <g stroke="rgba(94,234,212,0.55)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 200l44-36M118 178l24 24"/>
    <path d="M120 296c28-8 52-32 60-60" opacity="0.8"/>
  </g>
  <circle cx="96" cy="200" r="6" fill="#14b8a6" opacity="0.85"/>
  <circle cx="448" cy="320" r="5" fill="#f59e0b" opacity="0.55"/>
  <!-- Spark dots -->
  <circle cx="136" cy="124" r="3" fill="#5eead4" opacity="0.8"/>
  <circle cx="424" cy="156" r="2.5" fill="#a5b4fc" opacity="0.7"/>
  <circle cx="152" cy="340" r="2" fill="#fde68a" opacity="0.9"/>
</svg>
